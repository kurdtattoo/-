<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Website</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {
    background: #ffffff;
    color: #111111;
    font-family: Arial, Helvetica, sans-serif;
}

.app {
    width: 100%;
    max-width: 600px;
    min-height: 100vh;
    margin: 0 auto;
    background: white;
}

/* TOP EMPTY SPACE */
.top-banner {
    width: 100%;
    height: 35px;
    background: #f7f7f7;
}

/* HEADER */
.header {
    width: 100%;
    height: 90px;
    display: flex;
    align-items: center;
    justify-content: space-around;
    border-bottom: 1px solid #eeeeee;
    background: white;
}

/* CATEGORY */
.category {
    width: 25%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    cursor: pointer;
}

/* CIRCLE */
.icon {
    width: 45px;
    height: 45px;
    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #eeeeee;

    font-size: 21px;

    margin-bottom: 5px;
}

/* ACTIVE CIRCLE */
.category.active .icon {
    background: #111111;
    color: white;
}

/* TEXT */
.name {
    font-size: 11px;
    color: #555555;
}

.category.active .name {
    color: #111111;
    font-weight: bold;
}

/* NEW */
.new {
    position: absolute;
    top: -3px;
    right: 8px;

    background: #ff2d64;
    color: white;

    font-size: 7px;
    font-weight: bold;

    padding: 3px 5px;
    border-radius: 5px;
}

/* CONTENT */
.content {
    padding: 25px 18px;
}

h1 {
    font-size: 28px;
    margin-bottom: 7px;
}

.subtitle {
    color: #777777;
    font-size: 15px;
    margin-bottom: 20px;
}

/* TEST CARD */
.card {
    width: 100%;
    height: 250px;
    background: #eeeeee;
    border-radius: 22px;

    display: flex;
    align-items: center;
    justify-content: center;

    color: #777777;
    font-size: 16px;
}

/* MOBILE */
@media (max-width: 400px) {

    .header {
        height: 85px;
    }

    .icon {
        width: 40px;
        height: 40px;
        font-size: 19px;
    }

    .name {
        font-size: 10px;
    }

    .new {
        right: 3px;
    }

    .content {
        padding: 20px 15px;
    }

    h1 {
        font-size: 25px;
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- TOP -->
    <div class="top-banner"></div>

    <!-- HEADER -->
    <div class="header">

        <!-- HOME -->
        <div class="category active">
            <div class="icon">🏠</div>
            <div class="name">Home</div>
        </div>

        <!-- EXPERIENCES -->
        <div class="category">
            <div class="new">NEW</div>
            <div class="icon">💡</div>
            <div class="name">Experiences</div>
        </div>

        <!-- SERVICES -->
        <div class="category">
            <div class="new">NEW</div>
            <div class="icon">🛎️</div>
            <div class="name">Services</div>
        </div>

        <!-- FAVORITES -->
        <div class="category">
            <div class="icon">❤️</div>
            <div class="name">Favorites</div>
        </div>

    </div>


    <!-- MAIN -->
    <main class="content">

        <h1>Experiences</h1>

        <p class="subtitle">
            Unforgettable activities led by local hosts
        </p>

        <div class="card">
            Your experiences will appear here
        </div>

    </main>

</div>


<script>

const categories = document.querySelectorAll(".category");

categories.forEach(function(category) {

    category.addEventListener("click", function() {

        categories.forEach(function(item) {
            item.classList.remove("active");
        });

        category.classList.add("active");

    });

});

</script>

</body>
</html>
