<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Suggested for You</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(
          circle at 50% 20%,
          #1c2226 0%,
          #12171b 40%,
          #0c1114 100%
        );

      color: white;
      font-family: Arial, Helvetica, sans-serif;

      padding: 40px 30px 60px;
    }

    .container {
      width: 100%;
      max-width: 1160px;
      margin: auto;
    }

    /* =========================
       HEADER
    ========================= */

    .title {
      text-align: center;

      font-size: clamp(40px, 5vw, 68px);
      font-weight: 800;

      line-height: 1;
      letter-spacing: -2px;

      margin-bottom: 22px;

      outline: none;
    }

    .subtitle {
      text-align: center;

      color: #c9c9c9;

      font-size: clamp(25px, 3vw, 40px);
      font-weight: 500;

      margin-bottom: 75px;

      outline: none;
    }

    /* =========================
       ADS GRID
    ========================= */

    .ads {
      display: grid;

      grid-template-columns: repeat(2, 1fr);

      gap: 38px;
    }

    .ad {
      position: relative;

      width: 100%;

      aspect-ratio: 0.583;

      overflow: hidden;

      border-radius: 42px;

      background: #20252a;

      box-shadow:
        0 18px 50px rgba(0, 0, 0, 0.25);
    }

    .ad img {
      width: 100%;
      height: 100%;

      display: block;

      object-fit: cover;
    }

    /* =========================
       EDITABLE LABEL
    ========================= */

    .label {
      position: absolute;

      top: 22px;
      left: 22px;

      z-index: 5;

      padding: 7px 13px;

      border-radius: 999px;

      background: rgba(0, 0, 0, 0.72);

      color: white;

      font-size: 14px;
      font-weight: 700;

      backdrop-filter: blur(6px);

      outline: none;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 700px) {

      body {
        padding: 22px 14px 35px;
      }

      .title {
        font-size: 40px;
        margin-bottom: 12px;
      }

      .subtitle {
        font-size: 25px;
        margin-bottom: 38px;
      }

      .ads {
        gap: 18px;
      }

      .ad {
        border-radius: 25px;
      }

      .label {
        top: 12px;
        left: 12px;

        font-size: 11px;

        padding: 5px 9px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <!-- CHANGE THIS TEXT -->
    <h1
      class="title"
      contenteditable="true"
    >
      Suggested for you
    </h1>

    <!-- CHANGE THIS TEXT -->
    <div
      class="subtitle"
      contenteditable="true"
    >
      Ads
    </div>


    <section class="ads">

      <!-- AD 1 -->
      <div class="ad">

        <img
          src="card1.jpg"
          alt="Advertisement"
        >

        <div
          class="label"
          contenteditable="true"
        >
          Advertisement
        </div>

      </div>


      <!-- AD 2 -->
      <div class="ad">

        <img
          src="card2.jpg"
          alt="Advertisement"
        >

        <div
          class="label"
          contenteditable="true"
        >
          Advertisement
        </div>

      </div>


      <!-- AD 3 -->
      <div class="ad">

        <img
          src="card3.jpg"
          alt="Advertisement"
        >

        <div
          class="label"
          contenteditable="true"
        >
          Advertisement
        </div>

      </div>


      <!-- AD 4 -->
      <div class="ad">

        <img
          src="card4.jpg"
          alt="Advertisement"
        >

        <div
          class="label"
          contenteditable="true"
        >
          Advertisement
        </div>

      </div>

    </section>

  </main>

</body>
</html>
