<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #071426;
            color: #ffffff;

            display: flex;
            justify-content: center;
            align-items: center;

            overflow: hidden;
        }

        /* Background */

        .background {
            position: fixed;
            inset: 0;

            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(255, 115, 0, 0.12),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 80% 80%,
                    rgba(0, 91, 170, 0.18),
                    transparent 35%
                );

            pointer-events: none;
        }

        /* Login container */

        .login-container {
            width: 100%;
            max-width: 420px;

            padding: 20px;

            position: relative;
            z-index: 1;
        }

        /* Login box */

        .login-box {
            background: #0b1d33;

            border: 1px solid #173452;

            border-radius: 18px;

            padding: 45px 35px;

            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.5);

            animation: appear 0.7s ease-out;
        }

        /* Logo */

        .logo {
            text-align: center;

            margin-bottom: 10px;

            color: #ff7300;

            font-size: 32px;

            font-weight: 800;

            letter-spacing: 3px;
        }

        /* Title */

        .title {
            text-align: center;

            font-size: 22px;

            font-weight: 600;

            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;

            color: #8092a8;

            font-size: 14px;

            margin-bottom: 35px;
        }

        /* Input groups */

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;

            margin-bottom: 8px;

            color: #b8c5d3;

            font-size: 14px;

            font-weight: 600;
        }

        .input-group input {
            width: 100%;

            height: 52px;

            padding: 0 16px;

            border: 1px solid #28445f;

            border-radius: 10px;

            outline: none;

            background: #071426;

            color: #ffffff;

            font-size: 16px;

            transition: 0.25s ease;
        }

        .input-group input::placeholder {
            color: #52677d;
        }

        .input-group input:focus {
            border-color: #ff7300;

            box-shadow:
                0 0 0 3px rgba(255, 115, 0, 0.12);
        }

        /* Login button */

        .login-button {
            width: 100%;

            height: 52px;

            margin-top: 10px;

            border: none;

            border-radius: 10px;

            background: #ff7300;

            color: #ffffff;

            font-size: 16px;

            font-weight: 700;

            cursor: pointer;

            transition: 0.25s ease;
        }

        .login-button:hover {
            background: #ff841f;

            transform: translateY(-1px);

            box-shadow:
                0 8px 25px rgba(255, 115, 0, 0.25);
        }

        .login-button:active {
            transform: translateY(0);
        }

        /* Error message */

        .error {
            display: none;

            margin-top: 15px;

            padding: 12px;

            border-radius: 8px;

            background: rgba(220, 50, 50, 0.1);

            border: 1px solid rgba(220, 50, 50, 0.25);

            color: #ff7777;

            text-align: center;

            font-size: 14px;
        }

        /* Animation */

        @keyframes appear {
            from {
                opacity: 0;

                transform:
                    translateY(25px)
                    scale(0.97);
            }

            to {
                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);
            }
        }

        /* Mobile */

        @media (max-width: 500px) {

            .login-container {
                padding: 15px;
            }

            .login-box {
                padding: 35px 25px;
            }

            .logo {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>

    <div class="background"></div>

    <div class="login-container">

        <div class="login-box">

            <div class="logo">
                ADMIN
            </div>

            <div class="title">
                Admin Panel
            </div>

            <div class="subtitle">
                Sign in to continue
            </div>


            <!-- Username -->

            <div class="input-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    placeholder="Enter your username"
                    autocomplete="username"
                >

            </div>


            <!-- Password -->

            <div class="input-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                >

            </div>


            <!-- Login -->

            <button
                class="login-button"
                id="loginButton"
                type="button"
            >
                Login
            </button>


            <!-- Error -->

            <div
                class="error"
                id="errorMessage"
            >
                Please enter your username and password.
            </div>

        </div>

    </div>


    <script>

        const username = document.getElementById("username");
        const password = document.getElementById("password");
        const loginButton = document.getElementById("loginButton");
        const errorMessage = document.getElementById("errorMessage");


        loginButton.addEventListener("click", function () {

            const usernameValue = username.value.trim();
            const passwordValue = password.value.trim();


            if (usernameValue === "" || passwordValue === "") {

                errorMessage.textContent =
                    "Please enter your username and password.";

                errorMessage.style.display = "block";

                return;
            }


            errorMessage.style.display = "none";


            /*
                FIREBASE LOGIN WILL BE CONNECTED HERE
                IN THE NEXT STEP.
            */

            console.log("Login button clicked");

        });


        password.addEventListener("keydown", function (event) {

            if (event.key === "Enter") {
                loginButton.click();
            }

        });

    </script>

</body>
</html>
