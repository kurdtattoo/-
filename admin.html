<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login</title>

    <style>
        /* ========================================
           RESET
        ======================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            background: #071426;

            color: #111827;

            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 25px;

            overflow-x: hidden;
        }


        /* ========================================
           BACKGROUND
        ======================================== */

        .background {
            position: fixed;

            inset: 0;

            background:
                radial-gradient(
                    circle at 15% 20%,
                    rgba(255, 115, 0, 0.18),
                    transparent 30%
                ),

                radial-gradient(
                    circle at 85% 80%,
                    rgba(24, 73, 130, 0.35),
                    transparent 35%
                ),

                #071426;

            z-index: -2;
        }


        .background::before {
            content: "";

            position: absolute;

            inset: 0;

            background:
                linear-gradient(
                    135deg,
                    rgba(255,255,255,0.025),
                    transparent 40%
                );

            z-index: -1;
        }


        /* ========================================
           LOGIN WRAPPER
        ======================================== */

        .login-wrapper {
            width: 100%;

            max-width: 470px;

            animation: pageAppear 0.8s ease-out;
        }


        /* ========================================
           LOGIN CARD
        ======================================== */

        .login-card {
            position: relative;

            width: 100%;

            background: #ffffff;

            border-radius: 32px;

            padding: 42px 38px 38px;

            box-shadow:
                0 35px 80px rgba(0, 0, 0, 0.45);

            overflow: visible;
        }


        /* ========================================
           LOGO
        ======================================== */

        .logo-circle {
            position: absolute;

            width: 76px;
            height: 76px;

            top: -38px;

            left: 50%;

            transform: translateX(-50%);

            border-radius: 50%;

            background: #ffffff;

            display: flex;

            align-items: center;
            justify-content: center;

            box-shadow:
                0 15px 35px rgba(0, 0, 0, 0.18);

            border: 1px solid #eeeeee;

            z-index: 5;
        }


        .logo-circle span {
            width: 52px;
            height: 52px;

            border-radius: 16px;

            background: #0b2039;

            color: #ff7300;

            display: flex;

            align-items: center;
            justify-content: center;

            font-size: 21px;

            font-weight: 800;

            letter-spacing: -1px;
        }


        /* ========================================
           HEADING
        ======================================== */

        .heading {
            text-align: center;

            margin-top: 12px;

            margin-bottom: 8px;
        }


        .heading h1 {
            font-size: 30px;

            line-height: 1.2;

            font-weight: 700;

            color: #111827;

            letter-spacing: -0.8px;
        }


        .heading p {
            margin-top: 12px;

            color: #9aa1ad;

            font-size: 15px;

            line-height: 1.6;

            padding: 0 10px;
        }


        /* ========================================
           FORM
        ======================================== */

        .login-form {
            margin-top: 32px;
        }


        .field {
            margin-bottom: 21px;
        }


        .field label {
            display: block;

            margin-bottom: 9px;

            font-size: 14px;

            font-weight: 600;

            color: #252b35;
        }


        .input-wrapper {
            position: relative;

            width: 100%;
        }


        .input-icon {
            position: absolute;

            left: 17px;

            top: 50%;

            transform: translateY(-50%);

            width: 20px;

            height: 20px;

            color: #a5aab4;

            pointer-events: none;
        }


        .input-wrapper input {
            width: 100%;

            height: 58px;

            border: none;

            outline: none;

            border-radius: 16px;

            background: #f4f5f7;

            color: #151922;

            font-size: 16px;

            padding:
                0 48px
                0 50px;

            transition:
                background 0.2s ease,
                box-shadow 0.2s ease;
        }


        .input-wrapper input::placeholder {
            color: #a9adb6;
        }


        .input-wrapper input:focus {
            background: #f0f2f5;

            box-shadow:
                0 0 0 2px rgba(255, 115, 0, 0.2);
        }


        /* ========================================
           PASSWORD TOGGLE
        ======================================== */

        .password-toggle {
            position: absolute;

            right: 17px;

            top: 50%;

            transform: translateY(-50%);

            border: none;

            background: transparent;

            color: #a5aab4;

            cursor: pointer;

            padding: 5px;

            display: flex;

            align-items: center;

            justify-content: center;
        }


        .password-toggle:hover {
            color: #536071;
        }


        /* ========================================
           FORGOT PASSWORD
        ======================================== */

        .forgot {
            display: flex;

            justify-content: flex-end;

            margin-top: -5px;

            margin-bottom: 23px;
        }


        .forgot button {
            border: none;

            background: transparent;

            color: #252b35;

            font-size: 14px;

            font-weight: 600;

            cursor: pointer;
        }


        .forgot button:hover {
            color: #ff7300;
        }


        /* ========================================
           LOGIN BUTTON
        ======================================== */

        .login-button {
            width: 100%;

            height: 58px;

            border: none;

            border-radius: 17px;

            background: #0d0b14;

            color: #ffffff;

            font-size: 16px;

            font-weight: 600;

            letter-spacing: 0.1px;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                background 0.2s ease;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 10px;
        }


        .login-button:hover {
            background: #15121e;

            transform: translateY(-1px);

            box-shadow:
                0 10px 25px rgba(13, 11, 20, 0.18);
        }


        .login-button:active {
            transform: translateY(0);
        }


        .login-button.loading {
            pointer-events: none;

            opacity: 0.75;
        }


        /* ========================================
           DIVIDER
        ======================================== */

        .divider {
            display: flex;

            align-items: center;

            gap: 15px;

            margin: 27px 0;
        }


        .divider::before,
        .divider::after {
            content: "";

            height: 1px;

            background: #eceef1;

            flex: 1;
        }


        .divider span {
            color: #a6abb4;

            font-size: 12px;

            white-space: nowrap;
        }


        /* ========================================
           SECURITY MESSAGE
        ======================================== */

        .security {
            display: flex;

            align-items: center;

            justify-content: center;

            gap: 8px;

            color: #9ca2ad;

            font-size: 13px;

            line-height: 1.5;

            text-align: center;
        }


        .security-icon {
            color: #ff7300;

            flex-shrink: 0;
        }


        /* ========================================
           ERROR
        ======================================== */

        .error-message {
            display: none;

            margin-top: 15px;

            padding: 13px 15px;

            border-radius: 12px;

            background: #fff1f1;

            color: #c73c3c;

            font-size: 13px;

            text-align: center;

            border: 1px solid #ffd9d9;
        }


        .error-message.show {
            display: block;

            animation: errorAppear 0.25s ease;
        }


        /* ========================================
           ANIMATIONS
        ======================================== */

        @keyframes pageAppear {

            from {
                opacity: 0;

                transform:
                    translateY(25px)
                    scale(0.98);
            }

            to {
                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);
            }

        }


        @keyframes errorAppear {

            from {
                opacity: 0;

                transform: translateY(-5px);
            }

            to {
                opacity: 1;

                transform: translateY(0);
            }

        }


        /* ========================================
           MOBILE
        ======================================== */

        @media (max-width: 520px) {

            body {
                padding: 20px 15px;
            }


            .login-card {
                border-radius: 28px;

                padding:
                    38px
                    23px
                    30px;
            }


            .heading h1 {
                font-size: 27px;
            }


            .heading p {
                font-size: 14px;
            }


            .logo-circle {
                width: 70px;
                height: 70px;

                top: -35px;
            }


            .logo-circle span {
                width: 48px;
                height: 48px;

                font-size: 19px;
            }

        }
    </style>
</head>


<body>

    <div class="background"></div>


    <main class="login-wrapper">

        <section class="login-card">
