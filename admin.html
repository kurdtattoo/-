<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>کوردستان تاتۆ</title>

  <style>
    @font-face {
      font-family: "KurdistanTitle";
      src: url("./fonttitle.ttf") format("truetype");
    }

    @font-face {
      font-family: "CategoriesFont";
      src: url("./categoriesfont.ttf") format("truetype");
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #ffffff;
      color: #111111;
    }

    header {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px 0 10px;
    }

    h1 {
      font-family: "KurdistanTitle", sans-serif;
      font-size: 2rem;
      font-weight: normal;
      text-align: center;
    }

    .categories-title {
      font-family: "CategoriesFont", sans-serif;
      text-align: center;
      font-size: 1.5rem;
      font-weight: normal;
      margin-top: 10px;
    }

    .categories {
      width: min(900px, 92%);
      margin: 28px auto 0;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 24px;
    }

    .category {
      aspect-ratio: 1;
      border: 2px solid #111111;
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
      text-decoration: none;
      color: #111111;
    }

    .category-icon {
      font-family: Arial, sans-serif;
      font-size: 3rem;
      line-height: 1;
      margin-bottom: 18px;
      direction: ltr;
    }

    .category-name {
      font-family: "CategoriesFont", sans-serif;
      font-size: 1.15rem;
      font-weight: normal;
      line-height: 1.5;
    }

    @media (max-width: 700px) {
      .categories {
        grid-template-columns: repeat(2, 1fr);
        gap: 18px;
      }

      .category-icon {
        font-size: 2.5rem;
      }

      .category-name {
        font-size: 1rem;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>کوردستان تاتۆ</h1>
  </header>

  <div class="categories-title">پۆلەکان</div>

  <main class="categories">

    <a class="category" href="#">
      <div class="category-icon">♂</div>
      <div class="category-name">لەزگەی پیاوان</div>
    </a>

    <a class="category" href="#">
      <div class="category-icon">♀</div>
      <div class="category-name">لەزگەی ئافرەتان</div>
    </a>

    <a class="category" href="#">
      <div class="category-icon">A1</div>
      <div class="category-name">ژمارە و پیتەکان</div>
    </a>

    <a class="category" href="#">
      <div class="category-icon">✦</div>
      <div class="category-name">لەزگەکانی تر</div>
    </a>

  </main>

</body>
</html>
