<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>کوردستان تاتۆ</title>

  <style>
    @font-face {
      font-family: "KurdistanTitle";
      src: url("./fonttitle.ttf") format("truetype");
    }

    @font-face {
      font-family: "CategoriesFont";
      src: url("./categoriesfont.ttf") format("truetype");
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #0b0b0b;
      color: #ffffff;
      display: flex;
      flex-direction: column;
    }

    /* Header */

    header {
      width: 100%;
      padding: 20px 10px 16px;
      border-bottom: 1px solid #292929;
    }

    h1 {
      font-family: "KurdistanTitle", sans-serif;
      font-size: 1.8rem;
      font-weight: normal;
      text-align: center;
      margin-bottom: 16px;
    }

    /* Categories */

    .categories {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
    }

    .category {
      width: 75px;
      height: 75px;
      flex-shrink: 0;

      border: 1px solid #444444;
      border-radius: 50%;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      text-decoration: none;
      color: #ffffff;

      transition: 0.2s ease;
    }

    .category:hover {
      border-color: #ffffff;
      transform: translateY(-2px);
    }

    .category-icon {
      font-family: Arial, sans-serif;
      font-size: 1.5rem;
      line-height: 1;
      margin-bottom: 7px;
      direction: ltr;
    }

    .category-name {
      font-family: "CategoriesFont", sans-serif;
      font-size: 0.62rem;
      font-weight: normal;
      line-height: 1.3;
      text-align: center;
    }

    /* Main */

    main {
      flex: 1;
    }

    /* Mobile */

    @media (max-width: 420px) {
      header {
        padding-left: 6px;
        padding-right: 6px;
      }

      .categories {
        gap: 7px;
      }

      .category {
        width: 68px;
        height: 68px;
      }

      .category-icon {
        font-size: 1.3rem;
      }

      .category-name {
        font-size: 0.56rem;
      }
    }
  </style>
</head>

<body>

  <header>

    <h1>کوردستان تاتۆ</h1>

    <div class="categories">

      <a class="category" href="#">
        <div class="category-icon">♂</div>
        <div class="category-name">
          لەزگەی پیاوان
        </div>
      </a>

      <a class="category" href="#">
        <div class="category-icon">♀</div>
        <div class="category-name">
          لەزگەی ئافرەتان
        </div>
      </a>

      <a class="category" href="#">
        <div class="category-icon">A1</div>
        <div class="category-name">
          ژمارە و پیتەکان
        </div>
      </a>

      <a class="category" href="#">
        <div class="category-icon">✦</div>
        <div class="category-name">
          لەزگەکانی تر
        </div>
      </a>

    </div>

  </header>

  <main>
  </main>

</body>
</html>
